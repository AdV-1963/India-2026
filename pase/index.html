<!doctype html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>India 2026 · Pase de diapositivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Laila:wght@500;600&family=Martel:wght@400;600&family=Hind:wght@400;600&display=swap">
<style>
:root{--turmeric:#e8892b;--kumkum:#c45f0a;--navy:#0d1b4c;--display:"Laila",Georgia,serif;--body:"Martel",Georgia,serif;--ui:"Hind","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
.ly{position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease;overflow:hidden;background:#000}
.ly.on{opacity:1}
.kb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:var(--ox,50%) var(--oy,50%);animation:kb var(--d,6s) linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) brightness(.45)}
.solo{position:absolute;left:50%;top:50%;height:94vh;max-width:94vw;transform:translate(-50%,-50%);animation:kb2 var(--d,6s) linear forwards;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@keyframes kb2{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.05)}}
.pair{position:absolute;inset:0;display:flex;gap:1.2vw;align-items:center;justify-content:center;padding:3vh 2vw;background:#0b0b0b;animation:kb3 var(--d,6s) linear forwards}
.pair img{height:94vh;max-width:47.5vw;object-fit:cover;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@keyframes kb3{from{transform:scale(1)}to{transform:scale(1.04)}}
.card{position:absolute;inset:0;display:flex;align-items:center}
.card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42);transform-origin:50% 50%;animation:kb var(--d,7s) linear forwards}
.card .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,8,25,.78) 0%,rgba(5,8,25,.35) 60%,rgba(5,8,25,.1) 100%)}
.card .tx{position:relative;z-index:2;padding:0 8vw;max-width:62vw}
.eyebrow{font-family:var(--ui);font-size:clamp(.8rem,1.6vw,1.2rem);letter-spacing:.22em;text-transform:uppercase;color:var(--turmeric);margin-bottom:1.2vh}
.card h2{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,8vw,7.5rem);line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.card .dates{font-family:var(--ui);font-size:clamp(.9rem,1.8vw,1.4rem);letter-spacing:.08em;opacity:.85;margin-top:1.6vh}
.card .q{font-family:var(--body);font-style:italic;font-size:clamp(1rem,2.1vw,1.7rem);line-height:1.5;margin-top:4vh;max-width:46vw;opacity:0;animation:fin 1.6s ease 1.2s forwards}
@keyframes fin{to{opacity:.95}}
.card .num{font-family:var(--display);font-size:clamp(1.2rem,3vw,2.4rem);color:var(--turmeric);margin-bottom:.6vh}
.card svg.map{position:absolute;right:6vw;top:10vh;height:80vh;width:auto;max-width:34vw;z-index:2}
svg.map .land{fill:#fff;fill-opacity:.1;stroke:#fff;stroke-opacity:.55;stroke-width:1.2}
svg.map.india .land{fill-opacity:.07}
svg.map .hl{fill:var(--turmeric);fill-opacity:.55;stroke:none}
svg.map .dot{fill:var(--turmeric)}
svg.map .route{fill:none;stroke:var(--turmeric);stroke-opacity:.8;stroke-width:3;stroke-dasharray:7 6}
svg.map text{fill:#fff}
.mapcard{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 50%,#13235c 0%,#060a1e 75%);display:flex;align-items:center}
.mapcard svg.map{position:absolute;right:5vw;top:6vh;height:88vh;width:auto;max-width:42vw}
.mapcard h2{position:relative;max-width:48vw;line-height:1.05;font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,7vw,6.5rem);padding-left:8vw}
.cover h1{white-space:nowrap;font-family:var(--display);font-weight:600;font-size:clamp(3.4rem,13vw,12rem);line-height:.95}
.cover h1 em{font-style:normal;color:var(--turmeric)}
.cover .by{font-family:var(--ui);font-size:clamp(1.1rem,2.6vw,2rem);letter-spacing:.12em;margin-top:2vh}
.end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;text-align:center;padding:0 8vw}
.end p{font-family:var(--display);font-size:clamp(1.8rem,5vw,4.4rem);line-height:1.2;opacity:0;animation:fin 2.4s ease .6s forwards}
.end small{position:absolute;bottom:4vh;left:0;right:0;font-family:var(--ui);font-size:clamp(.6rem,1vw,.8rem);opacity:.45;padding:0 6vw}
#start{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2.4vh;padding:0 0 9vh;background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));height:45vh;text-align:center}
#start h1{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,9vw,7rem);line-height:1}
#start h1 em{font-style:normal;color:var(--turmeric)}
#start .go{font-family:var(--ui);font-size:1.15rem;letter-spacing:.12em;background:var(--turmeric);color:#111;border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
.lg button{font-family:var(--ui);background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:5px 12px;margin:0 3px;cursor:pointer;letter-spacing:.08em}
.lg button[aria-pressed=true]{background:#fff;color:#111}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-right));background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0));opacity:0;transition:opacity .4s}
body.ui #bar{opacity:1}
#bar button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;min-width:42px;height:42px;font-size:1rem;cursor:pointer}
#bar .sp{flex:1}
#prog{position:fixed;left:0;bottom:0;height:3px;background:var(--turmeric);z-index:11;width:0;transition:width .4s linear}
#bar a{color:#fff;opacity:.8;font-size:.85rem;text-decoration:none}
html[data-lang=es] [data-l=sl],html[data-lang=sl] [data-l=es]{display:none!important}
@media (max-aspect-ratio:1/1){.card .tx{max-width:90vw}.card svg.map,.mapcard svg.map{opacity:.35;max-width:70vw;right:2vw}.card .q{max-width:84vw}.pair img{max-width:48vw;height:auto;max-height:80vh}}
</style>
</head>
